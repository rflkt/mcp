# Calls the org's shared Go pipeline.
#
# A caller file rather than relying on the org ruleset alone: the ruleset
# dispatches the required workflow for private repos, and this repo is public.
# Whether a public repo may call a workflow stored in a PRIVATE one is exactly
# what this file tests.
#
# Deliberately NO `secrets: inherit`. go-lint.yml treats a missing
# ORG_CONFIG_TOKEN as an expected state -- it skips the shared lint config and
# still runs the vulnerability scan and the tests -- so this repo gets real CI
# without org credentials ever reaching a public repository's runners.
name: Go CI

on:
  pull_request:
  merge_group:
    types: [checks_requested]

jobs:
  go-ci:
    uses: rflkt/.github-private/.github/workflows/go-lint.yml@main
